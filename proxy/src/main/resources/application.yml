server:
  port: 8080

spring:
  application:
    name: backend-gateway-proxy

gateway:
  # Auth service configuration
  auth:
    enabled: true
    service-url: http://localhost:8081/auth/tokens  # Auth service endpoint
    session-id-header: X-Session-Id                 # Header name for session ID
    session-id-cookie: sessionId                    # Cookie name for session ID
    timeout: 5s
  
  # Schema validation settings
  schemas:
    directory: classpath:schemas/
    validate-requests: true        # Enable path/method validation
    validate-bodies: true           # Enable request body validation (disable to skip body checks)
    validate-responses: false       # Enable response validation (not implemented yet)
    strict-mode: true               # Reject if no schema found
    
  # Backend configurations (file-based - NO database!)
  backends:
    # Example: JWT authentication
    - name: example-service
      baseUrl: http://localhost:9001
      path: /api/v1/example
      schema: example-service.yaml
      timeout: 30s
      enabled: true
      securityType: jwt
      authScopes:
        - read:users
        - write:users
      
    # Example: Basic authentication
    # - name: legacy-service
    #   baseUrl: http://localhost:9003
    #   path: /api/v1/legacy
    #   schema: legacy-service.yaml
    #   timeout: 30s
    #   enabled: true
    #   securityType: basic
    #   securityConfig:
    #     username: ${LEGACY_SERVICE_USERNAME:admin}
    #     password: ${LEGACY_SERVICE_PASSWORD:secret}
    
    # Example: No authentication
    # - name: public-service
    #   baseUrl: http://localhost:9004
    #   path: /api/v1/public
    #   schema: public-service.yaml
    #   timeout: 30s
    #   enabled: true

# Actuator (health checks and metrics only)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# Resilience4j configuration
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 1s

# Logging
logging:
  level:
    root: INFO
    com.agent.gateway.proxy: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
