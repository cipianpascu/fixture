    #   securityType: basic
    #   tls-profile: mutual-tls
    #   securityConfig:
    #     username: ${LEGACY_SERVICE_USERNAME:admin}
    #     password: ${LEGACY_SERVICE_PASSWORD:secret}

    # Example: Cloud Run service-to-service authentication
    # - name: cloudrun-service
