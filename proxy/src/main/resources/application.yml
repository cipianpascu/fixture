# Quarkus HTTP configuration
quarkus:
  application:
    name: backend-gateway-proxy
  http:
    host: 0.0.0.0
    port: ${PORT:8080}
  log:
    level: INFO
    category:
      "com.agent.gateway.proxy":
        level: DEBUG
    console:
      format: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
  
  # Health and Metrics
  smallrye-health:
    ui:
      enable: true
  micrometer:
    enabled: true
    export:
      prometheus:
        enabled: true
        path: /q/metrics
  container-image:
    builder: jib
    build: false
    push: false
    registry: ${CONTAINER_IMAGE_REGISTRY:}
    group: ${CONTAINER_IMAGE_GROUP:}
    name: ${CONTAINER_IMAGE_NAME:${quarkus.application.name}}
    tag: ${CONTAINER_IMAGE_TAG:latest}
  jib:
    base-jvm-image: eclipse-temurin:21-jre
    ports:
      - ${PORT:8080}
    use-current-timestamp: true

# Gateway configuration
gateway:
  # Auth service configuration
  auth:
    enabled: true
    service-url: http://localhost:8081              # Auth service base URL
    session-id-header: X-Session-Id                 # Header name for session ID
    session-id-cookie: sessionId                    # Cookie name for session ID
    timeout: 5s
    # security-type: cloudrun                      # Optional Cloud Run IAM auth for private auth services
    # security-config:
    #   audience: https://oauth-service-abcde-ew.a.run.app/
    # tls-profile: internal-ca                    # Optional named TLS profile for HTTPS auth services

  # Optional outbound TLS profiles for auth service and backend calls
  tls:
    profiles: {}
    # profiles:
    #   internal-ca:
    #     truststore:
    #       path: /secrets/truststore.p12
    #       password: ${TRUSTSTORE_PASSWORD:changeit}
    #       type: PKCS12
    #   mutual-tls:
    #     truststore:
    #       path: /secrets/truststore.p12
    #       password: ${TRUSTSTORE_PASSWORD:changeit}
    #       type: PKCS12
    #     keystore:
    #       path: /secrets/client-keystore.p12
    #       password: ${KEYSTORE_PASSWORD:changeit}
    #       key-password: ${KEY_PASSWORD:${KEYSTORE_PASSWORD:changeit}}
    #       type: PKCS12
  
  # Schema validation settings
  schemas:
    directory: classpath:schemas/
    validate-requests: true        # Enable path/method validation
    validate-bodies: true           # Enable request body validation (disable to skip body checks)
    validate-responses: false       # Enable response validation (not implemented yet)
    strict-mode: true               # Reject if no schema found

  resources:
    order-summary:
      schema: order-summary.yaml
      orders-backend: orders-service
      orders-path-template: /details/{id}
      payments-backend: payments-service
      payments-path-template: /orders/{id}
    
  # Backend configurations (file-based - NO database!)
  backends:
    # Example: JWT authentication
    - name: example-service
      baseUrl: http://localhost:9001
      path: /api/v1/example
      schema: example-service.yaml
      timeout: 30s
      enabled: true
      securityType: jwt
      # tls-profile: internal-ca
      auth-request:
        sparte-gvo:
          - a
          - b
        btx:
          - FirstFunction
        pss:
          - SecondFunction
      
    # Example: Basic authentication
    # - name: legacy-service
    #   baseUrl: http://localhost:9003
