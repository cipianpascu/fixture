openapi: 3.0.0
info:
  title: Order Summary API
  version: 1.0.0

paths:
  /order-summaries/{id}:
    get:
      operationId: getOrderSummary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Combined order and payment summary
          content:
            application/json:
              schema:
                type: object
                required:
                  - order
                  - payment
                properties:
                  order:
                    type: object
                  payment:
                    type: object
