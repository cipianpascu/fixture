openapi: 3.0.0
info:
  title: Order Summary API
  version: 1.0.0

paths:
  /api/v1/order-summaries/{id}:
    get:
      operationId: getOrderSummary
      tags:
        - Order Summaries
      summary: Get a combined order and payment summary
      description: Returns an aggregated view composed from the orders and payments backends for a single order id.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Combined order and payment summary
          content:
            application/json:
              schema:
                type: object
                required:
                  - order
                  - payment
                properties:
                  order:
                    type: object
                  payment:
                    type: object
              example:
                order:
                  id: "123"
                  status: READY
                payment:
                  orderId: "123"
                  paymentStatus: PAID
        '400':
          description: Request validation failed
