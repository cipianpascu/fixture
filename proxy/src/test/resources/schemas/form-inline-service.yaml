openapi: 3.0.0
info:
  title: Form Inline Service
  version: 1.0.0
paths:
  /submit:
    post:
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - payload
              properties:
                payload:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
