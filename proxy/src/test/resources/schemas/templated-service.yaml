openapi: 3.0.0
info:
  title: Templated Service API
  version: 1.0.0

paths:
  /items/{id}:
    put:
      operationId: updateItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
      responses:
        '200':
          description: item updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
